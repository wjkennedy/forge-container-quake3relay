services:
  - key: q3-relay
    containers:
      - key: quake3-allinone
        tunnel:
          docker:
            build:
              context: ./services/quake3-allinone
              dockerfile: Dockerfile
            ports:
              - "8080:8080"
            environment:
              - SERVER_PORT=8080
        tag: ${TAG}
        health:
          type: http
          route:
            path: /healthz
        resources:
          cpu: "1"
          memory: "2Gi"
    scaling:
      min: 1
      max: 1

modules:
  webtrigger:
    - key: q3-relay-health-trigger
      endpoint: q3-relay-health
  endpoint:
    - key: q3-relay-health
      service: q3-relay
      route:
        path: /healthz
    - key: q3-relay-root
      service: q3-relay
      route:
        path: /

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/0fc32483-5342-46c9-9c21-2d5b6c68a963

environment:
  variables:
    - key: TAG
      default: q3-allinone-test-20260421
    - key: APP_ID
      default: 00000000-0000-4000-8000-000000000000
