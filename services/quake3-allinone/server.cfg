set vm_game 2           // I have no idea what this is
set vm_cgame 2          // Nope
set vm_ui 2             // Nada
set dedicated 1         // Dedicated server but not announced
set com_hunkmegs 512    // How much RAM for your server
set net_port 27960      // The network port

// general server info
seta sv_hostname "A9 Forge Quake Arena Relay"      // name that appears in server list
seta g_motd "Welcome to the Forge relay arena."      // message that appears when connecting
seta sv_maxclients 222           // max number of clients than can connect
seta sv_pure 0                  // browser demo clients use a repacked demoq3 data file
seta g_quadfactor 4             // quad damage strength (3 is normal)
seta g_friendlyFire 1           // friendly fire 

// free for all
seta g_gametype 0             // 0:FFA, 1:Tourney, 2:FFA, 3:TD, 4:CTF
seta timelimit 120             // Time limit in minutes
seta fraglimit 20             // Frag limit

seta g_weaponrespawn 2          // weapon respawn in seconds
seta g_inactivity 120           // kick players after being inactive for x seconds
seta g_forcerespawn 0           // player has to press primary button to respawn
seta g_log server.log           // log name
seta logfile 3                  // probably some kind of log verbosity?
seta rconpassword "sphere"       // sets RCON password for remote console
seta sv_privateClients 0         // keep all slots public for browser relay tests
seta sv_privatePassword ""       // no private password for browser relay tests
seta sv_allowDownload 1		// Enable downloads (of pk3)

seta rate "12400"               // not sure
seta snaps "40"                 // what this
seta cl_maxpackets "40"         // stuff is
seta cl_packetdup "1"           // all about

// bots
seta bot_enable 1       // Allow bots on the server
seta bot_nochat 1       // Keep bot chat quiet
seta g_spskill 1        // Default skill of bots [1-5]
seta bot_minplayers 0   // Explicit named bots are added by the map rotation

set add_relay_bots "addbot ForgeCharlie 1 free 1 Charlie; addbot ForgeScott 1 free 2 Scott; addbot ForgeMike 1 free 3 Mike"

// maps
set v1 "map q3dm17; vstr add_relay_bots; set nextmap vstr v2"
set v2 "map q3dm1; vstr add_relay_bots; set nextmap vstr v3"
set v3 "map q3dm7; vstr add_relay_bots; set nextmap vstr v1"
vstr v1
