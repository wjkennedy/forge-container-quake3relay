services:
  cloudflared-local:
    image: cloudflare/cloudflared:latest
    container_name: q3-relay-cloudflared-local
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ${CLOUDFLARED_RUNTIME_CONFIG:?Run scripts/prepare-cloudflared-tunnel.sh}:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_RUNTIME_CREDENTIALS:?Run scripts/prepare-cloudflared-tunnel.sh}:/etc/cloudflared/credentials.json:ro
    depends_on:
      - q3-relay
